# Tests for the handoff plugin this repo ships (plugins/handoff). Lives only in issues-loop itself:
# adopt.sh copies issues.yml into projects, never this file.
name: tests
on: [push, pull_request]
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m unittest discover -s tests -v
