# for instructions see ./readme.md
# AGENT-FILED ledger. Ids carry the "-agent" suffix. The owner's own entries live in
# ./issues.yaml with plain numeric ids. Claim the next id at the moment you append.
- id: 1-agent
  title: "docs say 'python scripts/...' but macOS has no 'python' binary"
  description: >-
    README.md, CLAUDE.md, .issues/readme.md and adopt.sh tell the user and the agent to run 'python
    scripts/issues.py ...'. On a stock macOS machine (and on the owner's machine, checked
    2026-09-26) 'python' is not on PATH; only 'python3' is, so every documented command fails with
    'command not found'. release.sh already calls python3. Switch the documented commands to python3
    (or add a note). Done when every documented command runs on a machine that only has python3.
